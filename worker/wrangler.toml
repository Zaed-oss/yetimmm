name = "yetimmm-bridge"
main = "worker.js"
compatibility_date = "2025-06-01"

[observability]
enabled = true

# HUB: one isolated hub per MT5 account (EA state, sessions, commands, order alerts)
# NOTIFY: economic calendar + unified notifications
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "NOTIFY"
class_name = "Notify"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Notify"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Budget"]

[[migrations]]
tag = "v4"
deleted_classes = ["Budget"]

# Secrets (never put these in this file): BOT_TOKEN, APP_PASSWORD, PAIR_CODE, ADMIN_KEY (optional), TE_KEY (optional)
[vars]
ALLOWED_ORIGIN = "https://zaed-oss.github.io"
