name = "yetimmm-bridge"
main = "worker.js"
compatibility_date = "2025-06-01"

[observability]
enabled = true

# ── Durable Objects ─────────────────────────────────────────────────────
# HUB    : one isolated hub per MT5 account (EA state, sessions, commands, order alerts)
# BUDGET : v4.23 ONE shared request counter for the whole Cloudflare account (all hubs report to it; ~1,000 extra requests/day, counted)
# NOTIFY : economic calendar + unified notifications (news alerts, order alerts, Telegram delivery)
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "NOTIFY"
class_name = "Notify"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Notify"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Budget"]

# ── Secrets (never put these in this file) ──────────────────────────────
#   wrangler secret put BOT_TOKEN      REQUIRED  Telegram bot token (also used to verify Telegram identity)
#   wrangler secret put APP_PASSWORD   REQUIRED  the app password. Login is refused until it exists.
#   wrangler secret put PAIR_CODE      REQUIRED  the EA <-> account PAIRING code. `npm run setup` generates a random one, stores it here and writes it to Yetimmm.cfg for the EA. No default value exists; there is no fallback to APP_PASSWORD.
#   wrangler secret put ADMIN_KEY     optional  enables GET /admin/diag (internal diagnostics: raw EA command log, technical failures, archive summary). Unset = the endpoint does not exist. Never shown in the Mini App.
#   wrangler secret put TE_KEY         optional  Trading Economics key (only used when no EA is online)
#
# ── Optional settings: uncomment the lines you need under [vars] above (an env value always wins over worker.js CONFIG) ──
[vars]
# PAIR_CODE is a SECRET (see above), not a line in this file. Do NOT add a PAIR_CODE line here unless you deliberately want a plain variable instead of the secret
# (never both: `npm run deploy` stops if it finds both). Without any PAIR_CODE the Worker answers HTTP 503 pair_not_configured.
# MINI_APP_URL = "https://YOUR-USER.github.io/YOUR-REPO/"   # OPTIONAL override. Normally NOT needed: the Worker reads the Menu-Button URL that `npm run setup:bot` sets. BANNER_URL optional (default: app URL + assets/banner.png)
# PRODUCTION: CORS is restricted to YOUR web app. The Origin is the DOMAIN ONLY (no /repo path). Several origins: comma separated.
# Not set / empty = no browser origin is allowed (fail-closed). "*" = open, local testing only (the admin view of GET / then reports corsOpen:true).
ALLOWED_ORIGIN = "https://zaed-oss.github.io"
# (v4.18: the wrong-password lock was removed by owner decision - no LOCK_SECONDS / MAX_ATTEMPTS settings exist any more)
# TG_AUTH_MAX_AGE_SEC = "86400"   # Telegram initData older than this is refused (auth_date)
# TG_FUTURE_SKEW_SEC  = "60"      # an auth_date this far ahead is tolerated (clock drift); more is refused
# OWNER_TG_MAX_AGE_SEC = "3600"   # PASSWORD-LESS owner sign-in needs an initData at most this old (reopen the Mini App if older)
# MAX_SESSIONS = "1000"           # safety ceiling of valid sessions per MT5 account: refuses NEW sign-ins only, never signs anyone out ("0" = unlimited)
# SESSION_DAYS   = "30"       # sliding session lifetime (any authenticated request extends it)
# EA_STALE_SEC   = "20"       # seconds without an EA sync before it counts as offline (the app reads this value from the server)
# NEWS_SCOPE     = "server"   # server = calendar/notifications per broker server (default) | global = one shared shard (v4.5 behaviour)
# SESSION_EPOCH  = "1"        # bump 1 -> 2 to sign EVERYBODY out at once
# REQUIRE_TG     = "1"        # "0" = allow sign-in from a normal browser (default: only inside Telegram)
# MT5_FEED       = "1"        # "0" = ignore the MT5 calendar and use only the external feeds
# NEWS_PROVIDER  = "auto"     # auto | ff | te
# MARKET_TZ      = "UTC"      # fallback platform time zone (the EA reports the real broker offset itself)
# ── v4.23 unified request budget (Cloudflare Workers Free = 100,000 requests/day, reset 00:00 UTC) ──────────────────────────────────────────────────────
# Layers: CF_DAILY_LIMIT (real plan limit) > DAILY_REQ_BUDGET (internal, always clamped to 90 % of the limit minus EXTERNAL_REQ_DAILY) > normal ceiling (budget minus RESERVE_PCT, which UI refreshes never spend).
# DAILY_REQ_BUDGET = "80000"   # internal operating budget. "0" = governor off (paid plan)
# CF_DAILY_LIMIT   = "100000"  # the REAL limit of your plan (set it when you are not on the Free plan)
# RESERVE_PCT      = "12"      # % of the internal budget kept for trading-critical traffic only
# PLAN_HOURS       = "12"      # one continuous session the budget is planned for (PACE_PLAN_HOURS of v4.21 is still understood)
# EXTERNAL_REQ_DAILY = "0"     # requests/day of OTHER services on the same Cloudflare account (they eat the same limit)
# OVERHEAD_PCT     = "8"       # Cloudflare counts requests no hub sees (CORS preflight, edge rejections, news, webhook): added to every reading
# IDLE_SYNC_SEC    = "3"       # EA full sync interval while NO app is open and no order alert is armed (1 = off, max 5)
# WATCH_SYNC_SEC   = "2"       # EA full sync interval while the app only WATCHES (no tap for 45 s) (1 = off, max 5)
# BUDGET_SHARED    = "1"       # "0" = every hub counts alone (no shared counter)
# Optional - the REAL number from Cloudflare analytics (secrets, never in this file):  wrangler secret put CF_API_TOKEN (Account Analytics: Read)  and  wrangler secret put CF_ACCOUNT_ID
