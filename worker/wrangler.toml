name = "yetimmm-bridge"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# "*" = any page may call the Worker (access is protected by each client's personal key, not by the origin).
# To restrict to ONE page instead, write its origin only (no path, no trailing slash), e.g. https://zaed-oss.github.io
ALLOWED_ORIGIN = "*"

# Secret (NOT written here):  wrangler secret put MASTER_SECRET
# ALLOWED_USERS / BOT_TOKEN / BRIDGE_KEY are no longer used and can be deleted from the dashboard.

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
