<head>

<title>Yetimmm</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b0a;--surf:#0f1716;--surf2:#162321;--line:rgba(255,255,255,.07);--gold:#d8ae4a;--gold2:#f3d682;--up:#3fcf8e;--dn:#ff5f6d;--txt:#eef2f0;--mute:#8797a0;--ov:rgba(0,0,0,.65);--btn:#04100a;--glow:rgba(216,174,74,.15);--sh:0 12px 36px rgba(0,0,0,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f1e8;--surf:#fffdf8;--surf2:#f3efe2;--line:rgba(70,45,0,.1);--gold:#a97c15;--gold2:#8a6208;--up:#0d8a55;--dn:#d1303f;--txt:#1c1a14;--mute:#70695a;--ov:rgba(30,20,0,.4);--btn:#fff;--glow:rgba(200,150,40,.2);--sh:0 10px 28px rgba(90,60,0,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{background:var(--bg) radial-gradient(120% 55% at 50% -8%,var(--glow),transparent 62%) no-repeat fixed;color:var(--txt);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;min-height:100%;padding:14px 14px 92px;line-height:1.5;transition:background-color .35s,color .35s}
button,input{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.up{color:var(--up)}.dn{color:var(--dn)}.gd{color:var(--gold2)}.mu{color:var(--mute)}
.app{max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 12px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent),transparent) 1}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(145deg,#1c1608,#3b2a08);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);display:grid;place-items:center;animation:pulse 3.2s ease-in-out infinite}
:root[data-theme="light"] .logo{background:linear-gradient(145deg,#fff6d8,#f0dca0)}
.logo svg{width:34px;height:34px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.sp{transform-origin:38px 9px;animation:tw 2.4s ease-in-out infinite}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-160%) skewX(-20deg);animation:sw 3.6s ease-in-out infinite;pointer-events:none}
@keyframes sw{0%{transform:translateX(-160%) skewX(-20deg)}55%,100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent,0 4px 14px color-mix(in srgb,var(--gold) 25%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 14%,transparent),0 4px 22px color-mix(in srgb,var(--gold) 50%,transparent)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.brand b{display:block;font-size:17px;line-height:1.2;letter-spacing:.2px}.brand small{color:var(--mute);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:flex;gap:6px;align-items:center;flex:none}
.ib{width:36px;height:36px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--gold2);transition:transform .15s,border-color .2s}.ib:hover{border-color:var(--gold)}.ib:active{transform:scale(.9)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .moon,:root[data-theme="light"] .sun{display:none}
.mode{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold2);white-space:nowrap}
.cd{width:7px;height:7px;border-radius:50%;background:var(--up);animation:bl 1.6s infinite}.mode.off .cd{background:var(--dn);animation:none}
@keyframes bl{50%{opacity:.3}}
.tab{display:none}.tab.on{display:block;animation:fi .28s ease}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05);transition:background-color .35s}
.card h3{font-size:12px;color:var(--mute);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.quote{padding:18px 16px 14px;background:linear-gradient(160deg,var(--surf2),var(--surf));border-top:2px solid var(--gold)}
.qt{display:flex;justify-content:space-between;align-items:flex-start}.qt small{font-size:12px;color:var(--mute);font-weight:600}
.pr{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-top:2px;transition:color .3s}.pr.up{color:var(--up)}.pr.dn{color:var(--dn)}
.chg{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--surf2)}
.spk{width:100%;height:38px;margin-top:8px;display:block}.spk polyline{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.state{display:flex;gap:12px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mute);flex:none}.dot.up{background:var(--up);box-shadow:0 0 0 5px color-mix(in srgb,var(--up) 18%,transparent)}.dot.dn{background:var(--dn);box-shadow:0 0 0 5px color-mix(in srgb,var(--dn) 18%,transparent)}.dot.gd{background:var(--gold)}
.state b{font-size:16px;display:block;line-height:1.3}.state small{color:var(--mute);font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 8px;border-radius:14px;font-weight:700;font-size:14px;background:var(--surf2);border:1px solid var(--line);transition:transform .12s,filter .2s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn.w{grid-column:1/-1}
.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--btn);border:0;box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 30%,transparent)}.go{background:var(--up);color:var(--btn);border:0}
.dg{background:color-mix(in srgb,var(--dn) 13%,transparent);color:var(--dn);border-color:transparent}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.kv div{background:var(--surf2);padding:10px 6px;text-align:center}.kv small{display:block;font-size:11px;color:var(--mute);margin-bottom:1px}.kv b{font-size:14px}
.tk{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:8px}.badge.up{background:color-mix(in srgb,var(--up) 16%,transparent)}.badge.dn{background:color-mix(in srgb,var(--dn) 16%,transparent)}
.big{font-size:32px;font-weight:700;line-height:1.2;margin:4px 0 14px}
.pb{position:relative;height:6px;border-radius:9px;margin:4px 0 16px}.pb u{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--txt);border:3px solid var(--surf);transform:translate(-50%,-50%);transition:left .5s}
.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:-8px 0 14px}
.fld{margin-bottom:12px}.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:600}
.stp{display:flex;gap:6px;direction:ltr}.sm{width:46px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);font-size:20px;flex:none;transition:transform .12s}.sm:active{transform:scale(.92)}
.inp{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:600;text-align:left;direction:ltr;transition:border-color .2s}
.inp:focus{border-color:var(--gold);outline:none}.inp:disabled{opacity:.5}
.auto{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mute);margin-top:7px;padding:7px 10px;border-radius:10px;background:var(--surf2);border:1px dashed var(--line)}.auto:empty{display:none}.auto b{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);font-size:12px;font-weight:600;transition:transform .12s}.chip:active{transform:scale(.95)}
#prev{white-space:pre-line}.note{font-size:12px;color:var(--mute);background:var(--surf2);border-radius:12px;padding:10px 12px;margin:2px 0 12px;text-align:center}.note.er{color:var(--dn);background:color-mix(in srgb,var(--dn) 10%,transparent)}
.hi{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surf2);border-radius:14px;margin-top:8px}
.hi small{display:block;color:var(--mute);font-size:11px}.hi b.p{font-size:15px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.rw:first-of-type{border-top:0;padding-top:0}
.rw .inp{width:104px;padding:10px;flex:none}.lb{font-size:13px;font-weight:600}.nt{font-size:11px;color:var(--mute);font-weight:400}
.rw.col{flex-direction:column;align-items:stretch;gap:8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;color:var(--mute)}.seg .on{background:var(--surf2);color:var(--gold2);box-shadow:0 0 0 1px var(--line)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:10px 2px 8px;font-size:13px;font-weight:600;color:var(--mute);position:relative}.nav button.on{color:var(--gold2)}.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
.ov{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;background:var(--surf);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}.sheet b{font-size:17px}.sheet p{color:var(--mute);font-size:13px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:calc(100% - 32px);max-width:440px;padding:12px 16px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);box-shadow:var(--sh);font-size:13px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:.3s;z-index:90}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:14px 0}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
.btn .ic{font-size:18px;margin-inline-end:7px}.nav .ic{font-size:22px;transition:transform .2s,filter .2s}.nav button.on .ic{transform:translateY(-2px);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--gold) 65%,transparent))}
.hl{display:inline-flex;align-items:center;gap:6px}.hl .ic{font-size:16px;color:var(--gold2)}.lb .ic{color:var(--gold2);margin-inline-end:6px;font-size:16px}
.sico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:22px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.sico.up{--c:var(--up)}.sico.dn{--c:var(--dn)}.sico.gd{--c:var(--gold2)}
.lv{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.8px;padding:2px 8px;border-radius:99px;margin-inline-start:8px;background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}.lv i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bl 1.4s infinite}
.spk polygon{stroke:none}
.hl2{display:flex;gap:11px;align-items:center}.hs{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;font-style:normal;background:color-mix(in srgb,currentColor 14%,transparent)}
.empty .ic{font-size:34px;opacity:.45}
.toast{display:flex;gap:8px;align-items:center;justify-content:center}.toast .ic{font-size:18px;color:var(--up)}.toast.bad .ic{color:var(--dn)}
.ver{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:18px;font-size:11px;color:var(--mute)}.ver .ic{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*,*::after{transition:none!important;animation:none!important}}
/* ── bot link status (live mode) ── */
.lnk{--c:var(--mute);display:flex;align-items:center;gap:11px;padding:10px 12px;margin:-6px 0 14px;border-radius:13px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);transition:background-color .3s,border-color .3s}
.lnk.ok{--c:var(--up)}.lnk.busy{--c:var(--gold2)}.lnk.off{--c:var(--dn)}
.lnk i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.lnk.ok i{animation:bl 1.6s infinite}
.lnk b{display:block;font-size:13px;line-height:1.35;color:var(--c)}.lnk small{display:block;font-size:11px;color:var(--mute);line-height:1.35}
.quote.stale .pr,.quote.stale .spk{opacity:.4}
.btn:disabled{opacity:.4;pointer-events:none}
.ib.dgb{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 30%,transparent)}.ib:disabled{opacity:.45}.hc{display:block;font-size:11px;color:var(--mute);margin-top:2px}.hs.wt{animation:pulse 2.4s ease-in-out infinite}.cmdst{font-size:11px;font-weight:700;white-space:nowrap;margin-inline-start:8px}
.quote.frozen .pr{color:var(--mute)!important}.quote.frozen .spk,.quote.frozen .chg{opacity:.35;filter:grayscale(1)}.quote.frozen{border-top-color:var(--dn)}#sov{z-index:70}.sheet .sico{border-radius:50%}

/* ── v2 polish ── */
.card{border-radius:20px;transition:transform .2s,box-shadow .2s,border-color .2s}.card:hover{border-color:color-mix(in srgb,var(--gold) 28%,var(--line))}

.btn{min-height:48px;position:relative;overflow:hidden}.btn:active{transform:scale(.97)}.btn.go{box-shadow:0 6px 18px color-mix(in srgb,var(--up) 28%,transparent)}.btn.dg{border:1px solid color-mix(in srgb,var(--dn) 30%,transparent)}
.ib{width:40px;height:40px}.ib:active{background:var(--surf2)}
.inp{min-height:48px;border-radius:14px}.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.hi{border:1px solid var(--line);border-inline-start:3px solid var(--gold);transition:transform .15s,background-color .2s}.hi:hover{transform:translateY(-1px)}
.hs{border-radius:12px}.big{letter-spacing:-.5px}
.sheet{position:relative;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:su .28s cubic-bezier(.2,.8,.2,1)}.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.pr.tu{animation:fu .5s}.pr.td{animation:fd .5s}
@keyframes fu{0%{text-shadow:0 0 18px var(--up)}100%{text-shadow:none}}@keyframes fd{0%{text-shadow:0 0 18px var(--dn)}100%{text-shadow:none}}
body.loading .pr,body.loading .kv b{color:transparent;border-radius:8px;background:linear-gradient(90deg,var(--surf2),var(--line),var(--surf2));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.nav{box-shadow:0 -8px 24px rgba(0,0,0,.18)}.nav button{min-height:56px}.nav button.on span{color:var(--gold2)}
.lnk #retryB{margin-inline-start:auto;width:36px;height:36px}.lnk #retryB[hidden]{display:none}
.toast{border-inline-start:3px solid var(--up)}.toast.bad{border-inline-start-color:var(--dn)}
::-webkit-scrollbar{width:0}

#lg{position:fixed;inset:0;z-index:999;background:var(--bg) radial-gradient(120% 55% at 50% -8%,var(--glow),transparent 62%) no-repeat;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#lg[hidden]{display:none}
@keyframes yfl{0%{background:color-mix(in srgb,var(--gold) 38%,transparent)}100%{background:transparent}}
.kv>div.flash{animation:yfl 1.2s ease-out;border-radius:8px}
.acc.stale{opacity:.55}.acc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.acc .top small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}

#lg .box{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:var(--sh);text-align:center}

function lotFor(risk,entry,sl){
  const d=Math.abs(entry-sl);if(d<1e-9)return{e:t("e_lot0")};
  const lot=r2(Math.floor(risk/(d*C)/STEP+1e-7)*STEP);
  if(lot<VMIN-1e-9)return{e:t("e_lotMin",VMIN)};
  if(lot>VMAX)return{e:t("e_lotMax")};
  return{lot,est:lot*d*C};
}

/* ═════════════ LOGIN (MT5 account number + password) ═════════════ */
const Login={
  has(){return !!SES.s&&!!SES.l},
  show(msg){const g=$("lg");g.className="";g.hidden=false;$("lgA").value=SES.l||$("lgA").value;$("lgP").value="";$("lgEr").textContent=msg||"";$("loB").hidden=true;$("lgGo").disabled=false},
  out(call,msg){
    if(call!==false&&SES.s){try{fetch(CONFIG.api.baseUrl+"/logout",{method:"POST",keepalive:true,headers:{"X-Login":SES.l,"X-Session":SES.s}}).catch(()=>{})}catch(e){}}
    SES.clr();try{sessionStorage.setItem("ytMsg",msg||"")}catch(e){}
    location.reload()          // everything restarts from scratch: no data of the previous account stays in memory
  },
  msg(){let m="";try{m=sessionStorage.getItem("ytMsg")||"";sessionStorage.removeItem("ytMsg")}catch(e){}return m&&D[m]?t(m):""},
  lock(sec){const er=$("lgEr"),b=$("lgGo"),end=Date.now()+sec*1000;clearInterval(this.lk);
    const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));
      if(!left){clearInterval(this.lk);b.disabled=false;er.textContent="";return}
      b.disabled=true;er.textContent=t("e_lockT",Math.floor(left/60)+":"+String(left%60).padStart(2,"0"))};
    tick();this.lk=setInterval(tick,500)},
  async go(){
    const l=$("lgA").value.replace(/\D/g,""),p=$("lgP").value,er=$("lgEr");er.textContent="";
    if(!/^\d{3,12}$/.test(l)){er.textContent=t("e_login");return}
    if(!p){er.textContent=t("e_pw_empty");return}
    const g=$("lg");g.className="w";$("lgGo").disabled=true;
    try{
      const init=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||"";
      const r=await fetch(CONFIG.api.baseUrl+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:l,pw:p,init})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.ok){this.show();$("lgA").value=l;
        if(d.error==="locked"){this.lock(d.retry||120);return}
        const k="e_"+(d.error||"srv");er.textContent=d.error==="bad_pw"&&d.left!=null&&d.left<=3?t("e_left",d.left):D[k]?t(k):t("e_srv");return}
      SES.set(l,d.sess);Verify.ok=true;g.className="ok";vib&&vib();
      setTimeout(()=>{g.hidden=true;g.className="";$("loB").hidden=false;Bridge.init=false;Bridge.ok=null;Bridge.pull()},1100);
    }catch(e){this.show();$("lgA").value=l;er.textContent=t("e_srv")}
  }
};

/* ═════════════ VERIFY (auto sign-in with a quick connection check) ═════════════
   Runs only while ENTERING the app with a saved session. All checks OK -> enters by itself.
   Hard failure (session / account / Telegram) -> sign-in screen. Soft failure (bot is off) -> waits and enters when it is back. */
const Verify={ok:false,busy:false,tm:null,tries:0,
  tgInit(){return new Promise(res=>{let n=0;const w=()=>{const x=window.Telegram&&Telegram.WebApp;if(x&&x.initData!==undefined&&(x.initData||n>12))return res(x.initData||"");if(++n>14)return res("");setTimeout(w,100)};w()})},
  row(id,st){const e=$(id);e.className="rw "+st;e.querySelector("i").textContent=st==="ok"?"✓":st==="no"?"✕":""},
  show(){$("vf").hidden=false},hide(){$("vf").hidden=true;clearTimeout(this.tm)},
  async run(manual){
    if(this.busy)return;this.busy=true;clearTimeout(this.tm);this.show();
    ["vfA","vfT","vfB","vfS"].forEach(i=>this.row(i,"run"));$("vfGo").disabled=true;$("vfM").textContent=t("vf_run");
    let d=null;
    try{
      const init=await this.tgInit();
      const r=await fetch(CONFIG.api.baseUrl+"/verify",{method:"POST",headers:{"Content-Type":"application/json","X-Login":SES.l,"X-Session":SES.s},body:JSON.stringify({init})});
      d=await r.json().catch(()=>null);
      if(r.status===429||r.status>=500)d=null;
    }catch(e){d=null}
    this.busy=false;$("vfGo").disabled=false;
    if(!d){["vfA","vfT","vfB","vfS"].forEach(i=>this.row(i,"no"));$("vfM").textContent=t("e_srv");this.next();return}
    const c=d.checks||{};
    this.row("vfS",c.session?"ok":"no");this.row("vfA",c.account?"ok":"no");this.row("vfT",c.session?(c.telegram?"ok":"no"):"no");this.row("vfB",c.bot?"ok":"no");
    if(d.ok){$("vfM").textContent=t("vf_okM");vib&&vib();setTimeout(()=>this.enter(),650);return}
    if(d.hard){      // different account / Telegram / expired / password changed -> normal sign-in
      const m=d.why==="pw"||d.why==="revoked"?"e_pw_changed":d.why==="expired"?"e_expired":d.why==="acct"?"e_acct":d.why==="tg"?"e_tgchg":"e_relogin";
      setTimeout(()=>Login.out(false,m),900);return}
    $("vfM").textContent=t("vf_wait");this.next()},      // only the bot is off: keep trying, enter automatically
  next(){clearTimeout(this.tm);this.tries++;this.tm=setTimeout(()=>{if(!document.hidden)this.run()},this.tries<10?3000:8000)},
  enter(){this.ok=true;this.hide();$("loB").hidden=false;Bridge.init=false;Bridge.ok=null;Bridge.pull()}
};
